<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuickBill - Invoice & Receipt Generator</title>
  
  <!-- Chosen Palette: Emerald & Night Sky -->
  <!-- Application Structure Plan: A centralized mobile-first dashboard for billing. The user can switch document types (A4 Invoice vs Thermal Receipt) using a segmented controller. Interactions are kept focused on quick item entry, automated calculations, and one-tap sharing to WhatsApp. This structure was chosen to maximize productivity for small business owners on the go. -->
  <!-- Visualization & Content Choices: Document Previews -> Interaction -> Using HTML/CSS to simulate paper types (A4 and Thermal). -> Library: html2canvas for image export. -> Justification: Visual accuracy helps users trust the output before sharing. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono { font-family: 'Space Mono', monospace; }
    
    .thermal-paper {
      background: white; color: black; position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .thermal-paper::after {
      content: ""; position: absolute; bottom: -8px; left: 0; width: 100%; height: 8px;
      background: radial-gradient(circle, transparent 50%, white 50%); background-size: 12px 12px;
    }
    .a4-paper {
      background: white; color: #1e293b; width: 100%; max-width: 650px;
      min-height: 842px; box-shadow: 0 20px 30px rgba(0,0,0,0.3);
    }

    @media print {
      body { background: white !important; }
      header, .no-print, #settings-modal, button { display: none !important; }
      #doc-modal { position: static !important; display: block !important; background: transparent !important; }
      #preview-wrapper { overflow: visible !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32">

  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-black">⚡</div>
      <h1 class="font-bold text-sm text-white">QuickBill</h1>
    </div>
    <button id="btn-open-settings" class="px-3 py-1.5 bg-slate-800 text-xs font-semibold rounded-xl border border-slate-700 flex items-center gap-1.5">
      <i data-lucide="store" class="w-3.5 h-3.5 text-emerald-400"></i>
      <span id="shop-name-badge">Setup Shop</span>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 flex gap-1">
      <button onclick="setDocType('Invoice')" id="type-Invoice" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-emerald-500 text-slate-950">Invoice</button>
      <button onclick="setDocType('Cash Bill')" id="type-Cash Bill" class="flex-1 py-2 rounded-xl text-xs font-bold transition text-slate-400">Receipt</button>
    </div>

    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
      <p class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Customer Information</p>
      <input type="text" id="client-name" placeholder="Customer Name" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm outline-none focus:border-emerald-500" />
      <input type="tel" id="client-phone" placeholder="WhatsApp Number" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm outline-none focus:border-emerald-500" />
    </section>

    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold uppercase text-slate-500">Items List</span>
        <span id="items-count" class="text-xs text-emerald-400 font-bold bg-emerald-950 px-2 py-0.5 rounded-full">1 Item</span>
      </div>
      <div id="items-container" class="space-y-3"></div>
      <button onclick="addItem()" class="w-full py-3 bg-slate-900 border border-dashed border-slate-700 rounded-2xl text-emerald-400 text-xs font-bold flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Item
      </button>
    </section>

    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 text-xs">
      <div class="flex justify-between items-center">
        <span class="text-slate-400">Subtotal</span>
        <span id="summary-subtotal" class="font-mono text-white">₹0.00</span>
      </div>
      <div class="flex justify-between items-center pt-2 border-t border-slate-800 font-extrabold">
        <span class="text-white">Total Amount</span>
        <span id="summary-grandtotal" class="font-mono text-emerald-400 text-base">₹0.00</span>
      </div>
    </section>
  </main>

  <!-- Document Modal -->
  <div id="doc-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur hidden flex flex-col">
    <div class="p-4 flex justify-between items-center border-b border-slate-800">
      <span class="font-bold text-sm">Preview Document</span>
      <button onclick="closeModal()" class="p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="preview-wrapper" class="flex-1 overflow-auto p-4 flex justify-center bg-slate-900">
        <div id="print-area">
            <div id="view-thermal" class="thermal-paper w-[280px] p-4 text-[10px] font-mono hidden">
                <div class="text-center border-b border-dashed border-gray-400 pb-2 mb-2">
                    <h2 id="t-shop-name" class="font-bold text-xs">SHOP NAME</h2>
                    <p id="t-shop-phone"></p>
                </div>
                <table class="w-full mb-2">
                    <tbody id="t-items"></tbody>
                </table>
                <div class="border-t border-dashed border-gray-400 pt-2 font-bold flex justify-between">
                    <span>TOTAL:</span>
                    <span id="t-total"></span>
                </div>
                <p class="text-center mt-4">Thank You!</p>
            </div>
            <div id="view-a4" class="a4-paper p-10 hidden">
                <div class="flex justify-between border-b pb-4 mb-4">
                    <div>
                        <h1 id="a-shop-name" class="text-xl font-bold">BUSINESS NAME</h1>
                        <p id="a-shop-address" class="text-xs text-gray-500"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold uppercase">Invoice</p>
                        <p id="a-date" class="text-xs text-gray-400"></p>
                    </div>
                </div>
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 uppercase text-[10px]">
                        <tr><th class="p-2">Description</th><th class="p-2 text-right">Qty</th><th class="p-2 text-right">Total</th></tr>
                    </thead>
                    <tbody id="a-items" class="divide-y divide-gray-100"></tbody>
                </table>
                <div class="mt-4 text-right">
                    <p class="text-lg font-bold">Total: <span id="a-total"></span></p>
                </div>
            </div>
        </div>
    </div>
    <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2 no-print">
        <button onclick="shareWhatsApp()" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold text-xs">Share WhatsApp</button>
        <button onclick="saveImage()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold text-xs">Save Image</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-sm rounded-3xl p-6 space-y-4 border border-slate-800">
      <h2 class="font-bold">Business Profile</h2>
      <input type="text" id="s-name" placeholder="Shop Name" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 outline-none" />
      <input type="text" id="s-phone" placeholder="Phone Number" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 outline-none" />
      <button onclick="saveProfile()" class="w-full py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Save Settings</button>
    </div>
  </div>

  <div class="fixed bottom-0 inset-x-0 p-4 bg-slate-900/90 border-t border-slate-800">
    <button onclick="generate()" class="w-full py-4 bg-emerald-500 text-slate-950 font-black rounded-2xl text-sm shadow-lg shadow-emerald-500/20 active:scale-95 transition">GENERATE BILL</button>
  </div>

  <script>
    let currentType = 'Invoice';
    let items = [{ id: 1, desc: '', qty: 1, price: 0 }];
    let profile = { name: 'My Shop', phone: '' };

    window.onload = () => {
        lucide.createIcons();
        const saved = localStorage.getItem('qb_profile');
        if(saved) {
            profile = JSON.parse(saved);
            document.getElementById('shop-name-badge').innerText = profile.name;
        } else {
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        renderItems();
    };

    function setDocType(t) {
        currentType = t;
        document.querySelectorAll('button[id^="type-"]').forEach(b => b.className = "flex-1 py-2 rounded-xl text-xs font-bold transition text-slate-400");
        document.getElementById(`type-${t}`).className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-emerald-500 text-slate-950";
    }

    function renderItems() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-slate-900 p-3 rounded-xl border border-slate-800 flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" value="${item.desc}" oninput="updateItem(${item.id},'desc',this.value)" placeholder="Item" class="flex-1 bg-transparent text-xs outline-none" />
                <input type="number" value="${item.qty}" oninput="updateItem(${item.id},'qty',this.value)" class="w-10 bg-transparent text-xs text-center font-bold text-emerald-400" />
                <input type="number" value="${item.price}" oninput="updateItem(${item.id},'price',this.value)" placeholder="₹" class="w-16 bg-transparent text-xs text-right font-bold" />
            `;
            container.appendChild(div);
        });
        calc();
    }

    function updateItem(id, f, v) {
        items = items.map(i => i.id === id ? {...i, [f]: f === 'desc' ? v : Number(v)} : i);
        calc();
    }

    function addItem() {
        items.push({ id: Date.now(), desc: '', qty: 1, price: 0 });
        renderItems();
    }

    function calc() {
        const total = items.reduce((s, i) => s + (i.qty * i.price), 0);
        document.getElementById('summary-subtotal').innerText = '₹' + total.toFixed(2);
        document.getElementById('summary-grandtotal').innerText = '₹' + total.toFixed(2);
        return total;
    }

    function saveProfile() {
        profile.name = document.getElementById('s-name').value;
        profile.phone = document.getElementById('s-phone').value;
        localStorage.setItem('qb_profile', JSON.stringify(profile));
        document.getElementById('shop-name-badge').innerText = profile.name;
        document.getElementById('settings-modal').classList.add('hidden');
    }

    document.getElementById('btn-open-settings').onclick = () => {
        document.getElementById('s-name').value = profile.name;
        document.getElementById('s-phone').value = profile.phone;
        document.getElementById('settings-modal').classList.remove('hidden');
    };

    function generate() {
        const total = calc();
        document.getElementById('doc-modal').classList.remove('hidden');
        if(currentType === 'Invoice') {
            document.getElementById('view-a4').classList.remove('hidden');
            document.getElementById('view-thermal').classList.add('hidden');
            document.getElementById('a-shop-name').innerText = profile.name;
            document.getElementById('a-total').innerText = '₹' + total.toFixed(2);
            const list = document.getElementById('a-items');
            list.innerHTML = items.map(i => `<tr><td class="p-2">${i.desc}</td><td class="p-2 text-right">${i.qty}</td><td class="p-2 text-right">₹${(i.qty*i.price).toFixed(2)}</td></tr>`).join('');
        } else {
            document.getElementById('view-thermal').classList.remove('hidden');
            document.getElementById('view-a4').classList.add('hidden');
            document.getElementById('t-shop-name').innerText = profile.name;
            document.getElementById('t-shop-phone').innerText = profile.phone;
            document.getElementById('t-total').innerText = '₹' + total.toFixed(2);
            document.getElementById('t-items').innerHTML = items.map(i => `<tr><td>${i.desc}</td><td class="text-right">${i.qty} x ${i.price}</td></tr>`).join('');
        }
    }

    function closeModal() { document.getElementById('doc-modal').classList.add('hidden'); }

    function saveImage() {
        const target = currentType === 'Invoice' ? 'view-a4' : 'view-thermal';
        html2canvas(document.getElementById(target)).then(canvas => {
            const a = document.createElement('a');
            a.download = 'bill.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    }

    function shareWhatsApp() {
        const total = calc();
        const clientPhone = document.getElementById('client-phone').value.replace(/\D/g,'');
        const text = `*${currentType} from ${profile.name}*\nTotal: ₹${total.toFixed(2)}\n\nThank you!`;
        window.open(`https://wa.me/${clientPhone}?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
